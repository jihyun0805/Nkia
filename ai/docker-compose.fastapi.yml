# 공통 베이스 compose
# dev 실행:
#   docker compose --env-file env.fastapi.dev.example \
#     -f docker-compose.fastapi.yml -f docker-compose.fastapi.dev.yml up -d --build
# prod 실행:
#   docker compose --env-file env.fastapi.prod.example \
#     -f docker-compose.fastapi.yml -f docker-compose.fastapi.prod.yml up -d --build

services:
  orbis_ai_api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AI_SERVER_PORT:-8002}:8000"
    environment:
      AI_DATABASE_URL: ${AI_DATABASE_URL}
      AI_DATABASE_POOL_MIN_SIZE: ${AI_DATABASE_POOL_MIN_SIZE:-1}
      AI_DATABASE_POOL_MAX_SIZE: ${AI_DATABASE_POOL_MAX_SIZE:-10}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AI_DB_USER: ${AI_DB_USER:-orbis_ai}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-orbis_ai}
      AI_DB_WAIT_TIMEOUT: ${AI_DB_WAIT_TIMEOUT:-180}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-768}
      AI_EMBEDDING_DEVICE: ${AI_EMBEDDING_DEVICE:-cpu}
      AI_EMBEDDING_BATCH_SIZE: ${AI_EMBEDDING_BATCH_SIZE:-4}
      AI_EMBEDDING_MAX_LENGTH: ${AI_EMBEDDING_MAX_LENGTH:-512}
      AI_ENABLE_DRAFT_ACTIONS: ${AI_ENABLE_DRAFT_ACTIONS:-false}
      AI_BUSINESS_CARD_MODEL_DIR: ${AI_BUSINESS_CARD_MODEL_DIR:-/models/business-card}
      AI_HF_CACHE_DIR: ${AI_HF_CACHE_DIR:-/models/huggingface}
      AI_UVICORN_WORKERS: ${AI_UVICORN_WORKERS:-1}
      GMS_KEY: ${GMS_KEY}
      GMS_CHAT_MODEL: ${GMS_CHAT_MODEL:-gpt-5-mini}
      TZ: Asia/Seoul
    volumes:
      - ai_model_cache:/models
      - ai_ocr_cache:/root/.paddleocr
      - ${AI_BUSINESS_CARD_MODEL_HOST_DIR:-/opt/orbis-ai/business-card-model}:/models/business-card:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

networks:
  app-network:
    external: true
    name: orbis_app-network

volumes:
  ai_model_cache:
  ai_ocr_cache:
