[project]
name = "orbis-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "numpy>=1.26,<3",
    "pillow>=10,<12",
    "paddleocr==3.3.3",
    "paddlepaddle==3.2.0",
    "peft>=0.15,<1",
    "psycopg[binary]==3.2.3",
    "psycopg-pool==3.2.4",
    "pydantic-settings==2.7.1",
    "prometheus-fastapi-instrumentator==7.0.2",
    "rapidfuzz>=3,<4",
    "sentence-transformers==3.4.1",
    "torch==2.6.0+cpu",
    "transformers>=4.57,<5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
